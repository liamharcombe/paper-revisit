<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Paper Revisit</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <section class="pin-gate" id="pinGate">
      <form class="pin-card" id="pinForm">
        <p class="eyebrow">Private access</p>
        <h1>Paper Revisit</h1>
        <label>
          PIN
          <input id="pinInput" type="password" inputmode="numeric" autocomplete="current-password" maxlength="4" placeholder="Enter PIN">
        </label>
        <p class="pin-error" id="pinError" aria-live="polite"></p>
        <button class="button primary full-width" type="submit">Unlock</button>
      </form>
    </section>

    <div class="app-shell locked" id="appShell">
      <header class="topbar">
        <div>
          <h1>Paper Revisit</h1>
        </div>
        <div class="topbar-actions">
          <label class="toggle-control admin-only">
            <input id="avoidWeekendsToggle" type="checkbox">
            <span>Avoid weekends</span>
          </label>
          <label class="toggle-control">
            <input id="emailRemindersToggle" type="checkbox">
            <span>Email reminders</span>
          </label>
          <span class="sync-status" id="syncStatus">Local only</span>
          <button class="button primary" id="newPaperButton" type="button">New paper</button>
        </div>
      </header>

      <main>
        <section class="panel due-panel">
          <div class="panel-heading">
            <div>
              <h2>Today</h2>
            </div>
            <span class="counter" id="dueCount">0</span>
          </div>
          <div class="list" id="dueList"></div>
        </section>

        <section class="panel">
          <div class="panel-heading">
            <div>
              <h2>Upcoming</h2>
            </div>
          </div>
          <div class="timeline" id="scheduleList"></div>
        </section>
      </main>
    </div>

    <dialog class="modal" id="paperModal">
      <form method="dialog" class="modal-card" id="paperForm">
        <div class="modal-header">
          <div>
            <p class="eyebrow">Add paper</p>
            <h2>Schedule a paper</h2>
          </div>
          <button class="icon-button modal-close" type="button" aria-label="Close">x</button>
        </div>

        <div class="form-grid">
          <label>
            Title
            <input id="paperTitleInput" type="text" placeholder="Paper title" required>
          </label>
          <label>
            Authors
            <input id="paperAuthorsInput" type="text" placeholder="Optional">
          </label>
          <label>
            Start page
            <input id="startPageInput" type="number" min="1" value="1">
          </label>
          <label>
            Last page
            <input id="endPageInput" type="text" placeholder="end or page number">
          </label>
        </div>

        <div class="modal-actions">
          <button class="button secondary modal-close" type="button">Cancel</button>
          <button class="button primary" id="addPaperSubmit" value="default" type="submit">Add paper</button>
        </div>
      </form>
    </dialog>

    <dialog class="modal" id="editModal">
      <form method="dialog" class="modal-card" id="editForm">
        <div class="modal-header">
          <div>
            <p class="eyebrow">Edit item</p>
            <h2 id="editModalTitle">Paper</h2>
          </div>
          <button class="icon-button modal-close" type="button" aria-label="Close">x</button>
        </div>

        <div class="form-grid">
          <label>
            Title
            <input id="editTitleInput" type="text" required>
          </label>
          <label>
            Authors
            <input id="editAuthorsInput" type="text" placeholder="Optional">
          </label>
          <label>
            Start page
            <input id="editStartPageInput" type="number" min="1">
          </label>
          <label>
            Last page
            <input id="editEndPageInput" type="text" placeholder="end or page number">
          </label>
          <label>
            Next review
            <input id="editDueDateInput" type="date" required>
          </label>
          <label class="full-row">
            Notes
            <textarea id="editNotesInput" rows="3" placeholder="Notes"></textarea>
          </label>
        </div>

        <div class="modal-actions split-actions">
          <button class="button danger" id="deleteItemButton" type="button">Delete</button>
          <div class="modal-actions">
            <button class="button secondary modal-close" type="button">Cancel</button>
            <button class="button primary" type="submit">Save</button>
          </div>
        </div>
      </form>
    </dialog>

    <dialog class="modal" id="reviewModal">
      <form method="dialog" class="modal-card">
        <div class="modal-header">
          <h2 id="reviewModalTitle">Review</h2>
          <button class="icon-button modal-close" type="button" aria-label="Close">x</button>
        </div>

        <div class="review-main">
          <div class="rating-row" role="group" aria-label="Review rating">
            <button class="rating-button" data-rating="soon" type="button">Again soon</button>
            <button class="rating-button selected" data-rating="normal" type="button">Normal</button>
            <button class="rating-button" data-rating="later" type="button">Later</button>
          </div>
          <div class="review-completion">
            <button class="button primary full-width" id="completeReviewButton" type="button">Reviewed</button>
            <div class="review-date-row">
              <label>
                Reviewed on
                <input id="reviewDateInput" type="date">
              </label>
              <button class="button secondary" id="completeReviewOnDateButton" type="button">Use date</button>
            </div>
          </div>
        </div>
      </form>
    </dialog>

    <template id="emptyTemplate">
      <div class="empty-state">Nothing here yet.</div>
    </template>

    <script type="module" src="app.js"></script>
  </body>
</html>
